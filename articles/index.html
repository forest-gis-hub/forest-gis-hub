
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Forest GIS Hubの記事一覧。林業技術、QGIS、GISデータ、リモートセンシングに関する情報を掲載しています。">
  <title>記事一覧 | Forest GIS Hub</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    .articles-main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 70px 24px 100px;
    }

    .articles-heading {
      margin-bottom: 48px;
    }

    .articles-heading h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      margin-bottom: 16px;
    }

    .articles-heading p {
      line-height: 1.9;
    }

    .article-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      gap: 24px;
    }

    .article-card {
      background: #fff;
      border: 1px solid #e0e8e2;
      border-radius: 12px;
      padding: 28px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .article-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(20, 55, 35, 0.08);
    }

    .article-category {
      display: inline-block;
      color: #286647;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .article-card h2 {
      font-size: 1.25rem;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .article-card p {
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .article-link {
      color: #286647;
      font-weight: bold;
      text-decoration: none;
    }

    .article-link:hover {
      text-decoration: underline;
    }

    .articles-back {
      display: inline-block;
      margin-top: 48px;
      color: #286647;
    }

/* 記事検索エリア */
.article-search {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 32px;
  max-width: 480px;
}

.article-search label {
  font-size: 0.9rem;
  font-weight: 600;
  color: #244b3a;
}

.article-search input {
  width: 100%;
  padding: 14px 18px;
  border: 1px solid #d7e2d9;
  border-radius: 8px;
  background: #ffffff;
  color: #183b32;
  font: inherit;
  font-size: 0.95rem;
  box-sizing: border-box;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.article-search input:focus {
  outline: none;
  border-color: #367b57;
  box-shadow: 0 0 0 3px rgba(54, 123, 87, 0.12);
}

.article-search input::placeholder {
  color: #82958a;
}

.article-grid .article-card[hidden] {
  display: none;
}

.article-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}

.filter-btn {
  padding: 10px 18px;
  border: 1px solid #d7e2d9;
  border-radius: 999px;
  background: #fff;
  color: #286647;
  font: inherit;
  cursor: pointer;
  transition: 0.2s;
}

.filter-btn:hover {
  background: #edf5ef;
}

.filter-btn.active {
  background: #286647;
  border-color: #286647;
  color: #fff;
}

.filter-btn:focus-visible {
  outline: 3px solid #87b69b;
  outline-offset: 3px;
}

#article-count {
  color: #687b70;
  font-size: 0.9rem;
  margin-bottom: 20px;
}
.article-grid .article-card[hidden] {
  display: none;
}

/* 記事が見つからない場合の表示 */
#article-empty[hidden] {
  display: none;
}

#article-empty {
  padding: 30px;
  text-align: center;
  color: #687b70;
  background: #f3f7f3;
  border-radius: 10px;
}

</style>
  </style>
</head>
<body>
<div class="topline"><div class="container topline-inner"><span>FORESTRY · GIS · REMOTE SENSING</span><span>森林・林業と地理空間情報のナレッジハブ</span></div></div>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="../index.html" aria-label="Forest GIS Hub ホーム">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M24 3 8 25h9L7 39h34L31 25h9L24 3Z" fill="currentColor"/><path d="M22 30h4v15h-4z" fill="#d8c9a2"/></svg></span>
        <span><strong>FOREST GIS HUB</strong><small>森林・林業・地理空間情報</small></span>
      </a>
      <button class="menu-toggle" aria-label="メニューを開く" aria-expanded="false">☰</button>
     
<nav class="main-nav" aria-label="メインナビゲーション">
  <a href="../index.html">ホーム</a>
  <a class="active" href="index.html">特集・記事</a>
  <a href="../index.html#map">地図・GIS</a>
  <a href="../index.html#data">データ</a>
  <a href="../index.html#about">このサイトについて</a>
</nav>

    </div>
  </header>
  <main class="articles-main">
    <div class="articles-heading">
      <p>FOREST GIS HUB / ARTICLES</p>
      <h1>記事一覧</h1>
      <p>
        林業技術、QGIS、GISデータ、リモートセンシングなど、
        森林と地理空間情報に関する技術情報を掲載しています。
      </p>
    </div>

<div class="article-search">
  <label for="article-search-input">記事を検索</label>
  <input
    type="search"
    id="article-search-input"
    placeholder="キーワードを入力（例：QGIS、林道）"
  >
</div>

<div class="article-filters" aria-label="記事カテゴリ">
  <button type="button" class="filter-btn active" data-category="all">すべて</button>
  <button type="button" class="filter-btn" data-category="QGIS">QGIS</button>
  <button type="button" class="filter-btn" data-category="林業技術">林業技術</button>
  <button type="button" class="filter-btn" data-category="GISデータ">GISデータ</button>
</div>

<p id="article-count" aria-live="polite"></p>

  
<div class="article-grid" id="article-grid"></div>

<p id="article-empty" hidden>
  該当する記事はありません。
</p>


    <a class="articles-back" href="../index.html">
      ← トップページに戻る
    </a>
  </main>

<script src="../script.js" defer></script>



<script>
  const searchInput = document.getElementById("article-search-input");
  const articleGrid = document.getElementById("article-grid");
  const filterButtons = document.querySelectorAll(".filter-btn");
  const articleCount = document.getElementById("article-count");
  const emptyMessage = document.getElementById("article-empty");

  let articles = [];
  let selectedCategory = "all";

  function filterArticles() {
    const keyword = (searchInput?.value || "")
      .trim().normalize("NFKC").toLowerCase();

    let visibleCount = 0;

    articleGrid.querySelectorAll(".article-card").forEach(card => {
      const text = card.textContent.normalize("NFKC").toLowerCase();
      const category = card.dataset.category;

      const visible =
        text.includes(keyword) &&
        (selectedCategory === "all" || category === selectedCategory);

      card.hidden = !visible;
      if (visible) visibleCount++;
    });

    articleCount.textContent =
      visibleCount + " 件の記事が見つかりました";

    emptyMessage.hidden = visibleCount !== 0;
  }

  function createArticleCard(article) {
    const card = document.createElement("article");
    card.className = "article-card";
    card.dataset.category = article.category;

    const category = document.createElement("span");
    category.className = "article-category";
    category.textContent = article.category;

    const title = document.createElement("h2");
    title.textContent = article.title;

    const description = document.createElement("p");
    description.textContent = article.description;

    card.append(category, title, description);

    if (article.status === "published" && article.url) {
      const link = document.createElement("a");
      link.className = "article-link";
      link.href = article.url;
      link.textContent = "記事を読む →";
      card.appendChild(link);
    } else {
      const status = document.createElement("span");
      status.textContent = "記事準備中";
      card.appendChild(status);
    }

    return card;
  }

  async function loadArticles() {
    try {
      const response = await fetch("./articles.json");

      if (!response.ok) {
        throw new Error("記事データの取得に失敗しました");
      }

      const data = await response.json();

      if (!Array.isArray(data)) {
        throw new Error("記事データの形式が正しくありません");
      }

      articles = data;

      articleGrid.replaceChildren(
        ...articles.map(createArticleCard)
      );

      filterArticles();

    } catch (error) {
      console.error(error);
      articleCount.textContent = "記事を読み込めませんでした";
      emptyMessage.hidden = true;
    }
  }

  searchInput?.addEventListener("input", filterArticles);

  filterButtons.forEach(button => {
    button.addEventListener("click", () => {
      selectedCategory = button.dataset.category;

      filterButtons.forEach(btn => {
        const active = btn === button;
        btn.classList.toggle("active", active);
        btn.setAttribute("aria-pressed", String(active));
      });

      filterArticles();
    });

    button.setAttribute(
      "aria-pressed",
      String(button.classList.contains("active"))
    );
  });

  loadArticles();
</script>



</body>
</html>
