<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>地図ビューア | Forest GIS Hub</title>
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
<style>
:root{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;color:#1c342a}*{box-sizing:border-box}body{margin:0;background:#f4f7f4}header{background:#163d2c;color:white;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}header a{color:white;text-decoration:none}h1{font-size:1.15rem;margin:0}.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 64px)}aside{padding:20px;background:white;border-right:1px solid #d9e2da}aside h2{font-size:1rem;margin:0 0 16px}fieldset{border:0;padding:0;margin:0 0 24px}legend{font-weight:700;margin-bottom:10px}label{display:block;margin:10px 0;font-size:.94rem}input{accent-color:#276a46}input[type=range]{width:100%}#map{min-height:550px;height:calc(100vh - 64px)}.note{font-size:.8rem;line-height:1.7;color:#54665a}.status{padding:10px;background:#f2f6f2;border-radius:6px;font-size:.85rem}.leaflet-control-attribution{font-size:11px!important}@media(max-width:700px){.layout{display:flex;flex-direction:column}aside{padding:14px}#map{height:70vh;min-height:450px}}
/* 地図をサイドバーの領域へはみ出させない */
.layout > main{min-width:0;position:relative;overflow:hidden}
#map{width:100%;position:relative;z-index:0;overflow:hidden}
#map .leaflet-pane img{max-width:none!important;max-height:none!important}
/* Measurement controls: contained above the map, not the sidebar */
#map.area-drawing, #map.area-drawing .leaflet-container{cursor:crosshair!important;touch-action:none}
.measure-panel{position:absolute;top:12px;right:12px;z-index:1000;width:min(290px,calc(100% - 24px));background:#fff;border:1px solid #dce5dd;border-radius:12px;box-shadow:0 4px 20px #10291d26;padding:12px;color:#1c342a}
.measure-title{font-size:13px;font-weight:700;margin:0 0 9px}.measure-tools{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.measure-tools button,.measure-actions button{border:1px solid #cddbd0;border-radius:7px;background:white;color:#244534;padding:8px 5px;cursor:pointer;font-size:12px}.measure-tools button[aria-pressed=true]{background:#1d583b;color:white;border-color:#1d583b}.measure-result{margin:10px 0 5px;font-size:14px;font-weight:700;min-height:20px;overflow-wrap:anywhere}.measure-hint{font-size:11px;color:#65766b;margin:0 0 8px;line-height:1.5}.measure-actions{display:flex;gap:5px;flex-wrap:wrap}.measure-actions button{padding:6px 10px}.measure-actions button:disabled{opacity:.4;cursor:default}.measure-actions .primary{background:#e7f1e9}.measure-panel button:focus-visible{outline:2px solid #276a46;outline-offset:2px}#map.measuring{cursor:crosshair}.leaflet-container.measuring{cursor:crosshair!important}@media(max-width:700px){.measure-panel{top:8px;right:8px;width:min(270px,calc(100% - 16px));padding:9px}}
/* Collapsible measurement panel */
.measure-panel{padding:0;width:min(300px,calc(100% - 24px));overflow:hidden}
.measure-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:11px 13px;background:#fff;border:0;color:#1c342a;font:inherit;font-size:13px;font-weight:700;cursor:pointer;text-align:left}
.measure-toggle:hover{background:#f3f7f3}
.measure-toggle .chevron{transition:transform .15s ease}
.measure-toggle[aria-expanded=true] .chevron{transform:rotate(180deg)}
.measure-body{padding:0 12px 12px}
.measure-body[hidden]{display:none!important}
.measure-panel .measure-title{margin:0}
/* Map navigation controls */
.map-action-control{display:flex;flex-direction:column;gap:5px;margin-top:10px!important}
.map-action-control button{width:34px;height:34px;border:2px solid #b9c8bc;border-radius:5px;background:white;color:#183d2b;cursor:pointer;font-size:18px;box-shadow:0 1px 5px #0002}
.map-action-control button:hover{background:#edf5ef}
.map-action-control button:focus-visible{outline:2px solid #276a46;outline-offset:2px}
.coordinate-display{background:#fffffff0;padding:5px 9px;border-radius:5px;box-shadow:0 1px 5px #0002;font-size:12px;color:#183d2b}
#map:fullscreen{width:100vw!important;height:100vh!important;min-height:0!important;background:#fff}
#map:fullscreen .leaflet-control-container{display:block}

/* Forest GIS Hub: thematic layers */
.layer-card{border:1px solid #dce6de;border-radius:9px;padding:11px;margin:8px 0 15px;background:#fbfdfb}
.layer-card label{margin:3px 0 9px}.layer-card .layer-range{margin:5px 0 0}.layer-legend{display:flex;align-items:center;gap:8px;font-size:12px;margin:8px 0;color:#43594a}.legend-swatch{width:20px;height:13px;background:#e6a362;border:1px solid #b98751;border-radius:2px;flex:none}
.layer-card details{margin-top:9px;font-size:12px;color:#4b6253}.layer-card summary{cursor:pointer;font-weight:600}.layer-card details p{line-height:1.6;margin:7px 0 0}.layer-card a{color:#205c42}.layer-help{font-size:12px;color:#586c60;line-height:1.6}.layer-card input[type=range]{margin-top:4px}
.opacity-details{margin-top:7px!important}.opacity-details summary{font-weight:500!important;color:#365e47;list-style:revert;cursor:pointer}.opacity-control{padding:10px 3px 4px}.opacity-control label{display:block;margin:0 0 8px!important}.opacity-control input[type=range]{display:block;width:100%;height:28px;cursor:pointer;accent-color:#276a46}.opacity-control input[type=range]::-webkit-slider-thumb{width:20px;height:20px}

/* Compact layer selector and one shared opacity slider */
.simple-layer{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 0;border-bottom:1px solid #edf1ed}
.simple-layer label{margin:0;flex:1;font-size:13px}
.select-opacity{flex:none;border:1px solid #d4e0d6;background:#fff;border-radius:6px;color:#365b44;cursor:pointer;padding:5px 9px;font-size:15px}
.select-opacity[aria-pressed="true"]{background:#dfeee3;border-color:#4a8560}
.shared-opacity{background:#f1f6f1;border:1px solid #dce6de;border-radius:9px;padding:12px;margin:0 0 15px}
.opacity-head{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.shared-opacity label{font-size:12px;color:#4c6656;margin:7px 0 2px}
.shared-opacity input{width:100%;height:28px;cursor:pointer}
.leaflet-bottom.leaflet-left .leaflet-control-attribution a{color:#345c49;text-decoration:underline}
.leaflet-bottom.leaflet-left .leaflet-control-attribution{max-width:min(65vw,520px);white-space:normal;line-height:1.4;padding:4px 7px;background:rgba(255,255,255,.68);color:#46574b;border-radius:4px;backdrop-filter:blur(3px)}
.leaflet-bottom.leaflet-right .coordinate-display{margin-bottom:25px}
@media(min-width:701px){html,body{height:100%;overflow:hidden}.layout{height:calc(100dvh - 64px);min-height:0}.layout>aside{min-height:0;overflow-y:auto;overscroll-behavior:contain}.layout>main{min-height:0}#map{height:100%;min-height:0}}
@media(max-width:700px){.leaflet-bottom.leaflet-left .leaflet-control-attribution{max-width:75vw;font-size:10px!important}}
/* Printing: show only the map and its active-source attribution. */
@page{size:landscape;margin:10mm}
@media print{
  html,body{width:100%!important;height:auto!important;overflow:visible!important;margin:0!important;background:white!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header,.layout>aside,.measure-panel,.map-action-control,.coordinate-display,.leaflet-control-zoom{display:none!important}
  .layout{display:block!important;height:auto!important;min-height:0!important}
  .layout>main{display:block!important;overflow:visible!important;width:100%!important;height:auto!important}
  #map{display:block!important;width:100%!important;height:170mm!important;min-height:0!important;overflow:hidden!important;position:relative!important}
  #map .leaflet-control-attribution{display:block!important;background:rgba(255,255,255,.9)!important;color:#333!important;max-width:90%!important;font-size:10px!important}
  #map .leaflet-control-attribution a{color:#333!important}
  .leaflet-control-container .leaflet-top{display:none!important}
}

/* Compact header and a single collapsible sidebar */
header{padding:8px 14px;min-height:48px;gap:8px}
header h1{font-size:.94rem;line-height:1.3}
header .back-link{font-size:.78rem;white-space:nowrap}
.header-start{display:flex;align-items:center;gap:10px;min-width:0}
.sidebar-toggle{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.4);border-radius:6px;color:#fff;font:inherit;font-size:.78rem;white-space:nowrap;padding:6px 9px;cursor:pointer}
.sidebar-toggle:hover,.sidebar-toggle:focus-visible{background:rgba(255,255,255,.25)}
.layout{grid-template-columns:260px minmax(0,1fr)}
.layout.sidebar-collapsed{grid-template-columns:minmax(0,1fr)}
.layout.sidebar-collapsed>aside{display:none!important}
@media(min-width:701px){.layout{height:calc(100dvh - 48px)}.layout>main{min-height:0}#map{height:100%;min-height:0}}
@media(max-width:700px){header{padding:8px 10px}.header-start{gap:6px}header h1{font-size:.82rem}.sidebar-toggle{padding:6px;font-size:.75rem}.layout.sidebar-collapsed>aside{display:none!important}.layout.sidebar-collapsed #map{height:calc(100dvh - 48px);min-height:400px}}
@media print{header{display:none!important}}
</style>
</head>
<body>
<header><div class="header-start"><button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-expanded="true" aria-controls="layer-sidebar" aria-label="レイヤパネルを閉じる" title="レイヤパネルの開閉">☰ <span id="sidebar-toggle-label">レイヤ</span></button><h1>Forest GIS Hub <span style="font-weight:400">/ 地図ビューア</span></h1></div><a class="back-link" href="./index.html">← トップへ戻る</a></header>
<div class="layout" id="map-layout"><aside id="layer-sidebar">
<h2>地図レイヤー</h2>
<fieldset><legend>背景地図</legend><label><input type="radio" name="base" value="pale" checked> 淡色地図</label><label><input type="radio" name="base" value="std"> 標準地図</label><label><input type="radio" name="base" value="photo"> 写真</label></fieldset>
<fieldset><legend>森林情報</legend><div class="simple-layer"><label><input id="forest-toggle" type="checkbox" checked> 福岡県の国有林野</label><button class="select-opacity" type="button" data-select-layer="forest" aria-label="国有林野の不透明度を調整" title="不透明度を調整">⚙</button></div></fieldset>
<fieldset><legend>地形情報</legend>
<div class="simple-layer"><label><input id="slope-toggle" type="checkbox"> 傾斜量図</label><button class="select-opacity" type="button" data-select-layer="slope" aria-label="傾斜量図の不透明度を調整">⚙</button></div>
<div class="simple-layer"><label><input id="hillshade-toggle" type="checkbox"> 陰影起伏図</label><button class="select-opacity" type="button" data-select-layer="hillshade" aria-label="陰影起伏図の不透明度を調整">⚙</button></div>
<div class="simple-layer"><label><input id="redrelief-toggle" type="checkbox"> 赤色立体地図</label><button class="select-opacity" type="button" data-select-layer="redrelief" aria-label="赤色立体地図の不透明度を調整">⚙</button></div>
</fieldset>
<section class="shared-opacity" aria-label="選択したレイヤの不透明度"><div class="opacity-head"><strong>不透明度調整</strong><output id="shared-opacity-value">75%</output></div><label id="selected-layer-name" for="shared-opacity-range">福岡県の国有林野</label><input id="shared-opacity-range" type="range" min="0" max="100" value="75"></section>
<p class="layer-help">⚙で調整対象を選択します。地図左下には表示中のデータの出典が自動表示されます。</p>
</aside><main><div id="map" aria-label="福岡県周辺の地図"></div>
<section class="measure-panel" aria-label="地図計測ツール">
<button type="button" class="measure-toggle" id="measure-toggle" aria-expanded="false" aria-controls="measure-body"><span>📏 計測ツール</span><span class="chevron" aria-hidden="true">⌄</span></button>
<div class="measure-body" id="measure-body" hidden>
<div class="measure-tools"><button type="button" data-tool="distance" aria-pressed="false">↗ 距離</button><button type="button" data-tool="area" aria-pressed="false">⬡ 多角形</button><button type="button" data-tool="rectangle" aria-pressed="false">▭ 四角形</button><button type="button" data-tool="coordinate" aria-pressed="false">⌖ 座標</button></div>
<div class="measure-result" id="measure-result" aria-live="polite">ツールを選択</div>
<p class="measure-hint" id="measure-hint">距離・多角形はクリック、四角形はドラッグで計測。</p>
<div class="measure-actions"><button type="button" id="measure-undo" disabled>1点戻す</button><button type="button" id="measure-finish" class="primary" disabled>確定</button><button type="button" id="measure-clear">クリア</button><button type="button" id="measure-copy" hidden>座標をコピー</button></div>
</div>
</section></main></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const gsiCredit='出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener noreferrer">国土地理院（地理院タイル）</a>';
const baseLayers={
 pale:L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{attribution:gsiCredit,maxZoom:18}),
 std:L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{attribution:gsiCredit,maxZoom:18}),
 photo:L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',{attribution:gsiCredit,maxZoom:18})
};
const map=L.map('map',{center:[33.59,130.40],zoom:10,layers:[baseLayers.pale]});
let activeBase=baseLayers.pale;
// 地図操作：ホーム・現在地・全画面・マウス座標
const homeView={center:[33.59,130.40],zoom:10};
const actionControl=L.control({position:'topleft'});
actionControl.onAdd=function(){
  const container=L.DomUtil.create('div','map-action-control leaflet-control');
  const actions=[
    ['⌂','福岡県の初期表示に戻る',()=>map.setView(homeView.center,homeView.zoom)],
    ['◎','現在地へ移動',()=>{
      if(!navigator.geolocation){alert('このブラウザでは位置情報を利用できません。');return;}
      navigator.geolocation.getCurrentPosition(pos=>{
        const latlng=[pos.coords.latitude,pos.coords.longitude];
        if(window.currentPositionMarker)map.removeLayer(window.currentPositionMarker);
        window.currentPositionMarker=L.circleMarker(latlng,{radius:8,color:'#155b3c',weight:3,fillColor:'#6cbf87',fillOpacity:.85}).addTo(map).bindPopup('現在地（推定位置）');
        map.setView(latlng,15);
      },err=>alert('現在地を取得できませんでした。ブラウザの位置情報許可とHTTPS接続を確認してください。'),{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
    }],
    ['⎙','地図を印刷／PDF保存',()=>{window.print()}],
    ['⛶','地図を全画面表示／解除',async()=>{
      try{if(document.fullscreenElement)await document.exitFullscreen();else if(map.getContainer().requestFullscreen)await map.getContainer().requestFullscreen();else alert('このブラウザは全画面表示に対応していません。');}
      catch(e){alert('全画面表示を切り替えられませんでした。');}
    }]
  ];
  actions.forEach(([symbol,title,handler])=>{const button=L.DomUtil.create('button','',container);button.type='button';button.textContent=symbol;button.title=title;button.setAttribute('aria-label',title);L.DomEvent.on(button,'click',L.DomEvent.stop).on(button,'click',handler)});
  L.DomEvent.disableClickPropagation(container);
  return container;
};
actionControl.addTo(map);
const coordinateControl=L.control({position:'bottomleft'});
coordinateControl.onAdd=function(){const el=L.DomUtil.create('div','coordinate-display');el.textContent='緯度・経度：地図上にカーソルを移動';this._display=el;return el};
coordinateControl.addTo(map);
map.on('mousemove',e=>{coordinateControl._display.textContent=`緯度 ${e.latlng.lat.toFixed(6)} / 経度 ${e.latlng.lng.toFixed(6)}`});
map.on('mouseout',()=>{coordinateControl._display.textContent='緯度・経度：地図上にカーソルを移動'});
document.addEventListener('fullscreenchange',()=>setTimeout(()=>map.invalidateSize(),150));

document.querySelectorAll('input[name="base"]').forEach(el=>el.addEventListener('change',()=>{map.removeLayer(activeBase);activeBase=baseLayers[el.value];activeBase.addTo(map)}));
// 国有林野の透過PNG（XYZ形式）。ズーム12より上はズーム12の画像を拡大表示。
const forestCredit='国有林野：<a href="https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-A45.html" target="_blank" rel="noopener noreferrer">国土交通省 国土数値情報（A45）</a>（加工：Forest GIS Hub、<a href="https://creativecommons.org/licenses/by/4.0/deed.ja" target="_blank" rel="noopener noreferrer">CC BY 4.0</a>）';
map.createPane('forestPane');
map.getPane('forestPane').style.zIndex=450;
const forest=L.tileLayer('./tiles/{z}/{x}/{y}.png',{
  pane:'forestPane',
  minZoom:9,maxNativeZoom:12,maxZoom:18,opacity:0.75,
  attribution:forestCredit,errorTileUrl:''
});
forest.addTo(map);
const toggle=document.getElementById('forest-toggle');


toggle.addEventListener('change',()=>{
  if(toggle.checked){forest.addTo(map)}else{map.removeLayer(forest)}

});

// 地形タイルは背景地図の上・国有林野の下に表示する。
map.createPane('terrainPane');
map.getPane('terrainPane').style.zIndex=420;
const terrainCredit='出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener noreferrer">国土地理院（地理院タイル）</a>';
const terrainLayers={
 slope:L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/slopemap/{z}/{x}/{y}.png',{pane:'terrainPane',minZoom:3,maxNativeZoom:15,maxZoom:18,opacity:.65,attribution:terrainCredit}),
 hillshade:L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/hillshademap/{z}/{x}/{y}.png',{pane:'terrainPane',minZoom:2,maxNativeZoom:16,maxZoom:18,opacity:.55,attribution:terrainCredit}),
 redrelief:L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/sekishoku/{z}/{x}/{y}.png',{pane:'terrainPane',minZoom:2,maxNativeZoom:14,maxZoom:18,opacity:.65,attribution:terrainCredit})
};
for(const [key,layer] of Object.entries(terrainLayers)){
 const toggleEl=document.getElementById(key+'-toggle');
 toggleEl.addEventListener('change',()=>{if(toggleEl.checked)layer.addTo(map);else map.removeLayer(layer)});
}


// Shared opacity control: exactly one slider for the selected overlay.
const layerSettings={
 forest:{name:'福岡県の国有林野',layer:forest,opacity:75},
 slope:{name:'傾斜量図',layer:terrainLayers.slope,opacity:65},
 hillshade:{name:'陰影起伏図',layer:terrainLayers.hillshade,opacity:55},
 redrelief:{name:'赤色立体地図',layer:terrainLayers.redrelief,opacity:65}
};
let selectedOpacityLayer='forest';
const sharedRange=document.getElementById('shared-opacity-range');
const sharedValue=document.getElementById('shared-opacity-value');
const selectedName=document.getElementById('selected-layer-name');
const selectButtons=[...document.querySelectorAll('[data-select-layer]')];
function selectOpacityLayer(key){
 selectedOpacityLayer=key;
 const item=layerSettings[key];
 selectedName.textContent=item.name;
 sharedRange.value=item.opacity;
 sharedValue.textContent=item.opacity+'%';
 selectButtons.forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.selectLayer===key)));
}
selectButtons.forEach(btn=>btn.addEventListener('click',()=>selectOpacityLayer(btn.dataset.selectLayer)));
sharedRange.addEventListener('input',()=>{
 const item=layerSettings[selectedOpacityLayer];
 item.opacity=Number(sharedRange.value);
 item.layer.setOpacity(item.opacity/100);
 sharedValue.textContent=item.opacity+'%';
});
selectOpacityLayer('forest');
// Explicitly control attribution based on actual map layer visibility.
// Remove Leaflet's automatic control to avoid stale or duplicated credits.
map.attributionControl.remove();
const visibleCredits=L.control({position:'bottomleft'});
visibleCredits.onAdd=function(){
  this._container=L.DomUtil.create('div','leaflet-control-attribution active-attribution');
  L.DomEvent.disableClickPropagation(this._container);
  return this._container;
};
visibleCredits.addTo(map);
coordinateControl.setPosition('bottomright');
function updateVisibleCredits(){
  const credits=[gsiCredit]; // The base map is always displayed.
  if(map.hasLayer(forest))credits.push(forestCredit);
  // Terrain tiles share the same GSI attribution as the base map.
  visibleCredits._container.innerHTML=credits.join(' | ');
}
map.on('layeradd layerremove',updateVisibleCredits);
updateVisibleCredits();


// Sidebar toggle: reflow Leaflet after changing the available map width.
const sidebarToggle=document.getElementById('sidebar-toggle');
const mapLayout=document.getElementById('map-layout');
const sidebarToggleLabel=document.getElementById('sidebar-toggle-label');
sidebarToggle.addEventListener('click',()=>{
  const collapsed=mapLayout.classList.toggle('sidebar-collapsed');
  sidebarToggle.setAttribute('aria-expanded',String(!collapsed));
  sidebarToggle.setAttribute('aria-label',collapsed?'レイヤパネルを開く':'レイヤパネルを閉じる');
  sidebarToggleLabel.textContent=collapsed?'開く':'レイヤ';
  requestAnimationFrame(()=>map.invalidateSize({pan:false}));
  setTimeout(()=>map.invalidateSize({pan:false}),180);
});

// Refresh tile layout when preparing a print preview.
window.addEventListener('beforeprint',()=>{map.invalidateSize({pan:false})});
window.addEventListener('afterprint',()=>{map.invalidateSize({pan:false})});

// Built-in measurement tools (no additional libraries required).
const measureLayer=L.layerGroup().addTo(map);
const measureButtons=[...document.querySelectorAll('[data-tool]')];
const resultEl=document.getElementById('measure-result');
const hintEl=document.getElementById('measure-hint');
const undoBtn=document.getElementById('measure-undo');
const finishBtn=document.getElementById('measure-finish');
const clearBtn=document.getElementById('measure-clear');
const copyBtn=document.getElementById('measure-copy');
let tool=null,points=[],finished=false,copyText='';
let dragStart=null,dragRect=null,dragActive=false;
function dist(a,b){return a.distanceTo(b)}
function lengthMeters(ps){let n=0;for(let i=1;i<ps.length;i++)n+=dist(ps[i-1],ps[i]);return n}
function formatLength(m){return m>=1000?(m/1000).toLocaleString('ja-JP',{maximumFractionDigits:3})+' km':m.toLocaleString('ja-JP',{maximumFractionDigits:1})+' m'}
// Spherical polygon area (WGS84 mean Earth radius); approximate, not survey-grade.
function areaMeters(ps){if(ps.length<3)return 0;const R=6371008.8,rad=Math.PI/180;let sum=0;for(let i=0;i<ps.length;i++){const a=ps[i],b=ps[(i+1)%ps.length];let dl=(b.lng-a.lng)*rad;if(dl>Math.PI)dl-=2*Math.PI;if(dl< -Math.PI)dl+=2*Math.PI;sum+=dl*(2+Math.sin(a.lat*rad)+Math.sin(b.lat*rad))}return Math.abs(sum*R*R/2)}
function formatArea(a){if(a>=1000000)return (a/1000000).toLocaleString('ja-JP',{maximumFractionDigits:3})+' km²';if(a>=10000)return (a/10000).toLocaleString('ja-JP',{maximumFractionDigits:3})+' ha';return a.toLocaleString('ja-JP',{maximumFractionDigits:1})+' m²'}
function redraw(){measureLayer.clearLayers();if(!points.length)return;points.forEach(p=>L.circleMarker(p,{radius:5,color:'#14533a',weight:2,fillColor:'#fff',fillOpacity:1,interactive:false}).addTo(measureLayer));if(points.length>=2)L.polyline(points,{color:'#e06b38',weight:3,interactive:false}).addTo(measureLayer);if((tool==='area'||tool==='rectangle')&&points.length>=3)L.polygon(points,{color:'#e06b38',weight:2,fillColor:'#e6a362',fillOpacity:.22,interactive:false}).addTo(measureLayer)}
function refresh(){undoBtn.disabled=finished||!points.length||tool==='coordinate';finishBtn.disabled=finished||!(tool==='distance'&&points.length>=2||(tool==='area'||tool==='rectangle')&&points.length>=3);copyBtn.hidden=tool!=='coordinate'||!copyText;
if(!tool){resultEl.textContent='ツールを選択';hintEl.textContent='距離・多角形はクリック、四角形はドラッグで計測。'}
else if(tool==='distance'){resultEl.textContent=points.length>=2?formatLength(lengthMeters(points)):'距離：地点を指定';hintEl.textContent=finished?'計測完了。クリアすると再計測できます。':'地図をクリックして地点を追加。確定で終了。'}
else if(tool==='area'){resultEl.textContent=points.length>=3?formatArea(areaMeters(points)):'面積：頂点を指定';hintEl.textContent=finished?'計測完了。クリアで再計測できます。':'クリックで頂点を追加。ダブルクリックまたは確定で終了。'}
else if(tool==='rectangle'){resultEl.textContent=points.length>=3?formatArea(areaMeters(points)):'四角形：ドラッグで指定';hintEl.textContent=finished?'計測完了。再びドラッグで描き直せます。':'地図をドラッグして四角形を描きます。'}
else{resultEl.textContent=copyText||'座標：地点を指定';hintEl.textContent='地図をクリックすると緯度・経度（WGS84）を取得します。'}}
function clearMeasure(){points=[];finished=false;copyText='';dragStart=null;dragActive=false;dragRect=null;measureLayer.clearLayers();refresh()}
function setTool(next){tool=tool===next?null:next;clearMeasure();measureButtons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tool===tool)));map.getContainer().classList.toggle('measuring',!!tool);map.getContainer().classList.toggle('area-drawing',tool==='rectangle');if(tool==='rectangle'){map.dragging.disable()}else{map.dragging.enable()}if(tool==='area'||tool==='rectangle'){map.doubleClickZoom.disable()}else{map.doubleClickZoom.enable()}}
measureButtons.forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
// 初期状態は折りたたみ。閉じる際は描画結果を残し、地図操作だけ通常に戻す。
const measureToggle=document.getElementById('measure-toggle');
const measureBody=document.getElementById('measure-body');
measureToggle.addEventListener('click',()=>{
  const open=measureToggle.getAttribute('aria-expanded')!=='true';
  measureToggle.setAttribute('aria-expanded',String(open));
  measureBody.hidden=!open;
  if(!open){
    dragActive=false;
    tool=null;
    measureButtons.forEach(b=>b.setAttribute('aria-pressed','false'));
    map.getContainer().classList.remove('measuring','area-drawing');
    map.dragging.enable();
    map.doubleClickZoom.enable();
    // 結果表示と描画は残し、次のツール選択時に初期化する。
  }
});
map.on('click',e=>{if(!tool||tool==='rectangle')return;if(tool==='coordinate'){copyText=e.latlng.lat.toFixed(6)+', '+e.latlng.lng.toFixed(6);points=[e.latlng];finished=false}else if(!finished){points.push(e.latlng)}redraw();refresh()});
// 多角形はダブルクリックでも確定できる。
map.on('dblclick',e=>{if(tool!=='area'||finished)return;if(points.length>=2&&points[points.length-1].distanceTo(points[points.length-2])<0.1)points.pop();if(points.length>=3){finished=true;redraw();refresh()}});
// 四角形モード：ドラッグで矩形を指定。マウスとタッチの両方に対応。
const mapEl=map.getContainer();
function eventLatLng(e){const rect=mapEl.getBoundingClientRect();return map.containerPointToLatLng([e.clientX-rect.left,e.clientY-rect.top])}
function rectanglePoints(a,b){return [L.latLng(a.lat,a.lng),L.latLng(a.lat,b.lng),L.latLng(b.lat,b.lng),L.latLng(b.lat,a.lng)]}
mapEl.addEventListener('pointerdown',e=>{if(tool!=='rectangle'||e.button!==0||e.target.closest('.leaflet-control'))return;dragStart=eventLatLng(e);dragActive=true;finished=false;points=[];measureLayer.clearLayers();dragRect=L.rectangle(L.latLngBounds(dragStart,dragStart),{color:'#e06b38',weight:2,fillColor:'#e6a362',fillOpacity:.22,interactive:false}).addTo(measureLayer);mapEl.setPointerCapture(e.pointerId);e.preventDefault()});
mapEl.addEventListener('pointermove',e=>{if(!dragActive||tool!=='rectangle')return;dragRect.setBounds(L.latLngBounds(dragStart,eventLatLng(e)));e.preventDefault()});
function finishDrag(e){if(!dragActive)return;const end=eventLatLng(e);dragActive=false;if(mapEl.hasPointerCapture(e.pointerId))mapEl.releasePointerCapture(e.pointerId);if(Math.abs(e.clientX-(map.latLngToContainerPoint(dragStart).x+mapEl.getBoundingClientRect().left))<4&&Math.abs(e.clientY-(map.latLngToContainerPoint(dragStart).y+mapEl.getBoundingClientRect().top))<4){measureLayer.clearLayers();points=[];refresh();return}points=rectanglePoints(dragStart,end);finished=true;redraw();refresh();e.preventDefault()}
mapEl.addEventListener('pointerup',finishDrag);mapEl.addEventListener('pointercancel',()=>{dragActive=false;dragStart=null});
undoBtn.addEventListener('click',()=>{if(!finished&&points.length){points.pop();redraw();refresh()}});
finishBtn.addEventListener('click',()=>{if(!finishBtn.disabled){finished=true;refresh()}});
clearBtn.addEventListener('click',clearMeasure);
copyBtn.addEventListener('click',async()=>{if(!copyText)return;try{await navigator.clipboard.writeText(copyText);hintEl.textContent='座標をコピーしました。'}catch(e){hintEl.textContent='コピーできませんでした。表示された座標を選択してコピーしてください。'}});
// Escape exits measurement mode. Keep normal Leaflet navigation otherwise.
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&tool)setTool(tool)});

// 地図サイズの再計算（表示崩れ防止）
window.addEventListener('load',()=>map.invalidateSize());
window.addEventListener('resize',()=>map.invalidateSize());
</script>
</body></html>
